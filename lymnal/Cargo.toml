[package]
name = "lymnal"
version.workspace = true
edition.workspace = true
license.workspace = true

# One binary does everything: `lymnal` runs the service, `lymnal <command>`
# does the troubleshooting operations.
[[bin]]
name = "lymnal"
path = "src/main.rs"

[lib]
name = "lymnal"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
argon2.workspace = true
blake3.workspace = true
notify.workspace = true
ulid.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async_zip = { version = "0.0.17", features = ["tokio", "deflate"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["io", "compat"] }
tokio-stream = { version = "0.1", features = ["sync"] }
unicode-normalization = "0.1"
rand = "0.8"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
# Cross-platform disk free/total (statvfs on Unix, GetDiskFreeSpaceEx on Windows)
# and file mtime, so the same binary builds on Linux and Windows.
fs2 = "0.4"
filetime = "0.2"

# The tray is StatusNotifierItem over D-Bus — Linux only. On other platforms
# lymnal runs the same, just without a tray icon, so these aren't pulled in.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "tokio"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
blake3 = "1"
