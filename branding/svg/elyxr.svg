<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="orbClip"><circle cx="512" cy="512" r="300"></circle></clipPath>
    <radialGradient id="glassBody" cx="38%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"></stop>
      <stop offset="42%" stop-color="#ffe89a" stop-opacity=".14"></stop>
      <stop offset="74%" stop-color="#f0c02e" stop-opacity=".38"></stop>
      <stop offset="92%" stop-color="#b8830a" stop-opacity=".68"></stop>
      <stop offset="100%" stop-color="#7d5600" stop-opacity=".9"></stop>
    </radialGradient>
    <radialGradient id="innerLight" cx="58%" cy="86%" r="46%">
      <stop offset="0" stop-color="#fff6d0" stop-opacity=".6"></stop>
      <stop offset="70%" stop-color="#fff6d0" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="spec3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="note3" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffc9bd"></stop><stop offset="28%" stop-color="#f4553f"></stop>
      <stop offset="68%" stop-color="#cf1f22" stop-opacity="1"></stop><stop offset="100%" stop-color="#8a0d14"></stop>
    </linearGradient>
    <linearGradient id="cork3" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffe3b0"></stop><stop offset="45%" stop-color="#d79a4e"></stop>
      <stop offset="100%" stop-color="#8f5a1c"></stop>
    </linearGradient>
    <linearGradient id="fade3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"></stop>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <mask id="refl3"><rect x="0" y="820" width="1024" height="300" fill="url(#fade3)"></rect></mask>
    <filter id="blur3" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"></feGaussianBlur></filter>
    <filter id="blur3b" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"></feGaussianBlur></filter>
    <filter id="blur3c" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"></feGaussianBlur></filter>
    <clipPath id="flaskClip">
      <path d="M470 384 L470 470 L356 664 Q338 700 378 700 L646 700 Q686 700 668 664 L554 470 L554 384 Z"></path>
    </clipPath>
    <g id="noteShape">
      <path d="M470 384 L470 470 L356 664 Q338 700 378 700 L646 700 Q686 700 668 664 L554 470 L554 384 Z" fill="#ffffff" fill-opacity=".5"></path><path d="M470 384 L470 470 L356 664 Q338 700 378 700 L646 700 Q686 700 668 664 L554 470 L554 384 Z" fill="none" stroke="#b3212a" stroke-opacity=".45" stroke-width="7"></path>
      <g clip-path="url(#flaskClip)">
        <path d="M320 586 L704 586 L704 730 L320 730 Z" fill="url(#note3)"></path>
        <ellipse cx="512" cy="588" rx="136" ry="28" fill="#ff8b74" opacity=".85"></ellipse>
      </g>
      <rect x="450" y="330" width="124" height="58" rx="14" fill="url(#cork3)"></rect>
    </g>
    <g id="noteOutline" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="26" stroke-linejoin="round">
      <path d="M470 384 L470 470 L356 664 Q338 700 378 700 L646 700 Q686 700 668 664 L554 470 L554 384 Z"></path>
      <rect x="450" y="330" width="124" height="58" rx="14"></rect>
    </g>
  </defs>

  <ellipse cx="512" cy="836" rx="236" ry="34" fill="#5c3b0b" opacity=".3" filter="url(#blur3)"></ellipse>
  <ellipse cx="512" cy="852" rx="200" ry="46" fill="#f2cf5f" opacity=".5" filter="url(#blur3b)"></ellipse>
  <ellipse cx="500" cy="858" rx="96" ry="26" fill="#e8563f" opacity=".6" filter="url(#blur3c)"></ellipse>

  <g mask="url(#refl3)">
