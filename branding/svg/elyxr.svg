      <use xlink:href="#noteShape"></use>
      <path d="M492 400 L492 470 L392 640" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="14" stroke-linecap="round"></path>
      <ellipse cx="470" cy="624" rx="34" ry="16" fill="#ffd7cb" opacity=".55" transform="rotate(-18 470 624)"></ellipse>
      <ellipse cx="512" cy="678" rx="140" ry="26" fill="#6b0710" opacity=".35" filter="url(#blur3c)"></ellipse>
    </g>
    <g transform="translate(512,790) scale(1,-0.34) translate(-512,-540)" opacity=".22">
      <use xlink:href="#noteShape"></use>
    </g>
    <circle cx="512" cy="512" r="300" fill="url(#glassBody)"></circle>
    <circle cx="512" cy="512" r="300" fill="url(#innerLight)"></circle>
    <path d="M262 616 A 300 300 0 0 0 762 616 A 300 262 0 0 1 262 616 Z" fill="#fffbe8" opacity=".28" filter="url(#blur3c)"></path>
  </g>

  <circle cx="512" cy="512" r="299" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="9"></circle>
  <circle cx="512" cy="512" r="297" fill="none" stroke="#7d5600" stroke-opacity=".25" stroke-width="6"></circle>
  <path d="M512 244 C 652 244 748 306 748 380 C 748 442 652 470 512 470 C 372 470 276 442 276 380 C 276 306 372 244 512 244 Z" fill="url(#spec3)"></path>
  <ellipse cx="392" cy="322" rx="58" ry="34" fill="#ffffff" transform="rotate(-24 392 322)"></ellipse>
