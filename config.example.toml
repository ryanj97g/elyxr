# Example lymnal config. The installer copies this to
# ~/.config/lymnal/config.toml on first run. Tokens are never written by hand —
# they are minted at pairing and stored as argon2id hashes.

# "auto" binds this machine's own Tailscale address (found via `tailscale ip`),
# so nothing is hardcoded and it follows the machine if its IP changes. You can
# also set an explicit "100.x.y.z:7749" if you prefer. Tailscale only — no LAN,
# no port forwarding.
bind      = "auto:7749"
data_dir  = "~/.local/share/lymnal"
log_level = "info"                  # error|warn|info|debug|trace

[trove]
name = "trove"
# In server mode, lymnal serves this real folder on the Desktop; in client mode
# the service is stopped and this path is unused. Change it with
# `lymnal trove set <path>`.
path = "~/Desktop/trove"
follow_symlinks = false

# [[token]] entries are added by pairing, not by hand. Shape, for reference:
# [[token]]
# label     = "probookrjg"
# hash      = "argon2id$..."        # never the token itself
# role      = "owner"               # owner | guest
# max_bytes = 150_000_000_000

[limits]
max_bytes      = 150_000_000_000    # stop uploads past this
warn_at_bytes  = 100_000_000_000    # first warning
warn_every     =   5_000_000_000    # then every +5 GB
min_free_bytes =  15_000_000_000    # stop if the drive gets this empty

[download]
max_loose_files = 5                 # more than this arrives as a zip
max_conns       = 3

[upload]
chunk_bytes     = 8_388_608         # 8 MiB
stale_after_hrs = 48                # abandoned uploads swept

[list]
default_limit = 500
max_limit     = 2000

[client]
cache_bytes = 5_000_000_000         # or 1/4 of free space, min 500 MB
