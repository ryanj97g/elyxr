name: elyxr
description: "Elyxr — reach a folder on the server from anywhere."
publish_to: 'none'
version: 0.9.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4
  open_filex: ^4.0.0
  # Music playback and inline video preview, both on libmpv. Music opens sources
  # directly (a local trove file, or the Range-served /v1/download URL), so a
  # track starts on its first chunk instead of waiting for a whole download, and
  # no video is ever decoded for the deck. libs_video supplies the native mpv.
  media_kit: ^1.1.0
  media_kit_video: ^1.1.0
  media_kit_libs_video: ^1.0.0
  window_manager: ^0.4.2
  # The Nostalgia Mode sound effects only — short bundled one-shots, which is all
  # this is still here for. Music moved to media_kit above, which streams and
  # can set the auth headers a trove URL needs; audioplayers can do neither.
  audioplayers: ^6.0.0
  # Renders the file-type glyph set. The icons are monochrome silhouettes and are
  # tinted from the palette at draw time (BlendMode.srcIn), so they carry no colour
  # of their own and follow the theme like every other terminal element.
  flutter_svg: ^2.3.0
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the Android launcher icon (all densities + adaptive) from the elyxr
  # mark. The CI Android job derives the two source PNGs below from
  # branding/png/elyxr and runs `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/elyxr_icon.png"
  adaptive_icon_background: "#0B0E0C"
  adaptive_icon_foreground: "assets/branding/elyxr_icon_fg.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/filetype/
    - assets/sounds/
    - assets/music/
    - assets/fonts/custom/
    - assets/nonsense.txt

  fonts:
    - family: Chakra Petch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
          weight: 400
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    # Extra terminal faces, selectable in Settings › TYPEFACE.
    - family: Redacted Script
      fonts:
        - asset: assets/fonts/RedactedScript-Regular.ttf
    - family: Flow Circular
      fonts:
        - asset: assets/fonts/FlowCircular-Regular.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
    - family: Julius Sans One
      fonts:
        - asset: assets/fonts/JuliusSansOne-Regular.ttf
    - family: Ordinary Love
      fonts:
        - asset: assets/fonts/OrdinaryLove-Regular.ttf
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
    - family: Handjet
      fonts:
        - asset: assets/fonts/Handjet-Variable.ttf
    # Fallback-only faces: bundled so any script renders from fonts we ship, but
    # deliberately NOT offered in the TYPEFACE picker (see kTermFaces). Each is
    # cut down to one weight and to the scripts it is here for.
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
