name: elyxr
description: "Elyxr — reach a folder on the server from anywhere."
publish_to: 'none'
version: 0.9.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4
  window_manager: ^0.4.2
  # Audio via the system's GStreamer on Linux — uses the OS codecs (built for the
  # OS's own glibc), so no bundled-library incompatibilities. Replaced
  # flutter_soloud, whose precompiled codec libs required a newer glibc than most
  # systems have and failed to load entirely.
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/sounds/
    - assets/music/
    - assets/nonsense.txt

  fonts:
    - family: Chakra Petch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
          weight: 400
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    # Extra terminal faces, selectable in Settings › TYPEFACE.
    - family: Redacted Script
      fonts:
        - asset: assets/fonts/RedactedScript-Regular.ttf
    - family: Flow Circular
      fonts:
        - asset: assets/fonts/FlowCircular-Regular.ttf
    - family: Silkscreen
      fonts:
        - asset: assets/fonts/Silkscreen-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Variable.ttf
    - family: Julius Sans One
      fonts:
        - asset: assets/fonts/JuliusSansOne-Regular.ttf
    - family: Ordinary Love
      fonts:
        - asset: assets/fonts/OrdinaryLove-Regular.ttf
    - family: Odisean Tech
      fonts:
        - asset: assets/fonts/OdiseanTech-Regular.ttf
    - family: Holo Edge Four
      fonts:
        - asset: assets/fonts/HoloEdgeFour-Regular.otf
    - family: Digital Moneter
      fonts:
        - asset: assets/fonts/DigitalMoneter-Regular.otf
