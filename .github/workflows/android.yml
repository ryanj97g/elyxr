name: android-build

# Builds an Android APK on a Linux runner that already has the Android SDK, so no
# one needs Android Studio locally. The repo only carries the Linux desktop
# runner, so — exactly like the Windows job — we scaffold the Android project in
# CI with `flutter create --platforms=android .`, then build.
#
# Every platform-coupling problem (desktop-only plugins, unsupported APIs) shows
# up here as a build failure, and the produced app-debug.apk is what gets
# sideloaded onto a real phone to check features by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is `git rev-list --count HEAD`
          # (matches the Windows job and lymnal's ELYXR_BUILD).
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust (Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Android APK
        working-directory: elyxr
        run: |
          build=$(git rev-list --count HEAD)
          commit=$(git rev-parse --short HEAD)
          # The repo only carries the Linux runner; scaffold the Android one.
          # --org fixes the package to com.elyxr.elyxr so the committed
          # MainActivity/LymnalService (package com.elyxr.elyxr) drop straight in.
          flutter create --platforms=android --org com.elyxr .

          # The app's own SDK levels: minSdk 23 covers flutter_secure_storage's
          # Keystore backend; target 34.
          app_kts=android/app/build.gradle.kts
          if [ -f "$app_kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$app_kts"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$app_kts"
          fi

          # Force compileSdk 36 on EVERY Android module. Plugins (desktop_drop
          # especially) ship stubs compiled against android-33, but androidx now
          # requires 34+. We PREPEND an afterEvaluate override to the root project
          # so it (a) registers before Flutter's evaluationDependsOn forces
          # evaluation, and (b) runs after each plugin's own build script — so our
          # compileSdk wins over the stub's 33. (printf, not heredoc: heredoc
          # terminators break YAML block scalars.)
          root_groovy=android/build.gradle
          root_kts=android/build.gradle.kts
          if [ -f "$root_kts" ]; then
            tmp=$(mktemp)
            printf 'subprojects {\n    afterEvaluate {\n        val a = extensions.findByName("android")\n        if (a is com.android.build.gradle.BaseExtension) { a.compileSdkVersion(36) }\n    }\n}\n\n' > "$tmp"
            cat "$root_kts" >> "$tmp"; mv "$tmp" "$root_kts"
            echo "--- root kts head ---"; head -14 "$root_kts"
          elif [ -f "$root_groovy" ]; then
            tmp=$(mktemp)
            printf 'subprojects {\n    afterEvaluate { p ->\n        if (p.hasProperty("android")) { p.android { compileSdkVersion 36 } }\n    }\n}\n\n' > "$tmp"
            cat "$root_groovy" >> "$tmp"; mv "$tmp" "$root_groovy"
            echo "--- root groovy head ---"; head -14 "$root_groovy"
          fi

          # Drop in the real MainActivity (MethodChannel bridge to the lymnal
          # service) and the foreground service that execs lymnal. flutter create
          # already wrote a stub MainActivity in this package; overwrite it.
          kdir=android/app/src/main/kotlin/com/elyxr/elyxr
          mkdir -p "$kdir"
          cp packaging/android/MainActivity.kt "$kdir/MainActivity.kt"
          cp packaging/android/LymnalService.kt "$kdir/LymnalService.kt"

          # Manifest: the permissions lymnal needs (network + a long-running
          # foreground service + its notification) and the <service> declaration.
          # Single-line sed only (GNU sed turns \n in the replacement into real
          # newlines); heredocs would break this YAML block scalar.
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$manifest"
          # elyxr speaks plain http:// — to the server for pairing and to the
          # local lymnal proxy on loopback. Android blocks cleartext by default
          # (targetSdk >= 28), so without this every connection fails and the app
          # reports "couldn't find a server". The traffic is a private tailnet +
          # localhost, so allowing cleartext is correct here. Targets the first
          # (real) <application> tag only.
          sed -i '0,/<application/s//<application android:usesCleartextTraffic="true"/' "$manifest"
          sed -i 's#</application>#    <service android:name=".LymnalService" android:foregroundServiceType="dataSync" android:exported="false"/>\n    </application>#' "$manifest"
          echo "--- AndroidManifest.xml ---"; cat "$manifest"

          # Bundle lymnal INSIDE the app so the phone runs its own local daemon
          # with lymbo — the same client -> local-lymnal -> trove model as desktop.
          # Android allows executing a binary named lib*.so from the app's native
          # lib dir, so ship lymnal as liblymnal.so and keep native libs extracted
          # (useLegacyPackaging) so it lands on disk where it can be run.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* | tail -1)}"
          ( cd .. && cargo ndk -t arm64-v8a build --release -p lymnal )
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp ../target/aarch64-linux-android/release/lymnal android/app/src/main/jniLibs/arm64-v8a/liblymnal.so
          sed -i 's/^android {/android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' android/app/build.gradle.kts

          # Bundle a tracker-module renderer. The whole built-in soundtrack is
          # .xm/.mod/.s3m/.it; desktop renders them with openmpt123, which a
          # phone can't exec. Build libopenmpt (the same engine) for arm64 plus a
          # tiny C renderer (packaging/android/modrender.c) that writes WAV, and
          # ship them beside lymnal — exec'd from nativeLibraryDir. The WAV also
          # feeds the app's own FFT, so the visualizer works on Android too.
          # ndk-build is the engine's documented Android path (build/android_ndk).
          OMPT_TAG=libopenmpt-0.7.13
          git clone --depth 1 --branch "$OMPT_TAG" https://github.com/OpenMPT/openmpt modbuild/jni/libopenmpt
          cp modbuild/jni/libopenmpt/build/android_ndk/Android.mk    modbuild/jni/libopenmpt/Android.mk
          cp modbuild/jni/libopenmpt/build/android_ndk/Application.mk modbuild/jni/libopenmpt/Application.mk
          cp packaging/android/modrender.c modbuild/jni/modrender.c
          # Top-level jni makefiles: build libopenmpt (the subdir module) and our
          # modrender executable that links it. Capture jni's path first —
          # my-dir shifts to the subdir after all-subdir-makefiles.
          printf 'APP_ABI := arm64-v8a\nAPP_PLATFORM := android-23\nAPP_STL := c++_shared\nAPP_CFLAGS := -std=c11\nAPP_CPPFLAGS := -std=c++17 -fexceptions -frtti\n' > modbuild/jni/Application.mk
          printf 'MY_LOCAL_PATH := $(call my-dir)\nLOCAL_PATH := $(MY_LOCAL_PATH)\ninclude $(call all-subdir-makefiles)\nLOCAL_PATH := $(MY_LOCAL_PATH)\ninclude $(CLEAR_VARS)\nLOCAL_MODULE := modrender\nLOCAL_SRC_FILES := modrender.c\nLOCAL_C_INCLUDES := $(MY_LOCAL_PATH)/libopenmpt\nLOCAL_SHARED_LIBRARIES := openmpt\ninclude $(BUILD_EXECUTABLE)\n' > modbuild/jni/Android.mk
          "$ANDROID_NDK_HOME/ndk-build" -C modbuild NDK_PROJECT_PATH=. NDK_APPLICATION_MK=jni/Application.mk APP_BUILD_SCRIPT=jni/Android.mk -j"$(nproc)"
          ls -la modbuild/libs/arm64-v8a
          cp modbuild/libs/arm64-v8a/libopenmpt.so    android/app/src/main/jniLibs/arm64-v8a/libopenmpt.so
          cp modbuild/libs/arm64-v8a/libc++_shared.so android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          cp modbuild/libs/arm64-v8a/modrender        android/app/src/main/jniLibs/arm64-v8a/libmodrender.so

          flutter pub get
          flutter build apk --debug \
            --dart-define=ELYXR_BUILD=$build \
            --dart-define=ELYXR_COMMIT=$commit

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: elyxr-android
          path: elyxr/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
