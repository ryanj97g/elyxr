name: windows-build

# Builds the Windows binaries on a runner that already has the C++ toolchain, so
# no one needs Visual Studio on their own machine. Produces two downloads:
#   - elyxr-setup.exe   the one-click installer (also what the auto-updater fetches)
#   - elyxr-windows.zip  the raw app bundle + lymnal.exe, to run without installing
# On main it also publishes elyxr-setup.exe as the "latest" release, which is
# where a Windows client's self-update pulls the new build from.

on:
  push:
    branches: [windows-client, main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release on main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is `git rev-list --count HEAD`
          # (see lymnal/build.rs and the app's ELYXR_BUILD), which a shallow
          # clone would report as 1.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build lymnal
        run: cargo build --release -p lymnal

      - name: Build the elyxr app
        working-directory: elyxr
        shell: pwsh
        run: |
          $build = (git rev-list --count HEAD).Trim()
          $commit = (git rev-parse --short HEAD).Trim()
          flutter config --enable-windows-desktop
          # The repo only carries the Linux runner; scaffold the Windows one.
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release `
            --dart-define=ELYXR_BUILD=$build `
            --dart-define=ELYXR_COMMIT=$commit

      - name: Stage the build
        shell: pwsh
        run: |
          $stage = "packaging\windows\stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # The app: elyxr.exe plus its DLLs and data\ folder — the whole bundle
          # has to stay together.
          Copy-Item -Recurse -Force elyxr\build\windows\x64\runner\Release\* $stage\
          # lymnal alongside it (a standalone binary).
          Copy-Item -Force target\release\lymnal.exe $stage\
          # Bundle ffmpeg.exe next to the app so the visualizer and tracker
          # modules work on Windows (Linux uses the system ffmpeg). The BtbN GPL
          # build bundles libopenmpt, so ffmpeg alone also renders modules.
          $ff = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ff
          Expand-Archive -Path $ff -DestinationPath "$env:RUNNER_TEMP\ff" -Force
          $ffexe = (Get-ChildItem -Path "$env:RUNNER_TEMP\ff" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          Copy-Item -Force $ffexe $stage\
          # A zip of exactly that, for running without installing.
          Compress-Archive -Path "$stage\*" -DestinationPath elyxr-windows.zip -Force

      - name: Compile the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $build = (git rev-list --count HEAD).Trim()
          $commit = (git rev-parse --short HEAD).Trim()
          # Shared with the release step, which names the file and says in the
          # release body which commit is actually inside it.
          "ELYXR_BUILD=$build"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "ELYXR_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVer=$build" packaging\windows\elyxr.iss
          # ISCC writes to the script's OutputDir (.), i.e. packaging\windows\.
          Copy-Item -Force packaging\windows\elyxr-setup.exe .\elyxr-setup.exe
          # A build-numbered copy as well. The stable name is what the self-updater
          # fetches, but it's replaced in place every run — so a browser or CDN
          # holding that URL can serve an older installer that looks current, and
          # the release PAGE shows the tag's frozen target commit rather than
          # what's in the file. The filename is the one thing that can't lie.
          Copy-Item -Force .\elyxr-setup.exe ".\elyxr-setup-$build.exe"

      - name: Upload the builds
        uses: actions/upload-artifact@v4
        with:
          name: elyxr-windows
          path: |
            elyxr-setup.exe
            elyxr-windows.zip
          if-no-files-found: error

      # On main, publish elyxr-setup.exe to ONE stable release, updated in place —
      # the source a Windows client's self-update fetches. A fixed tag (not a
      # per-run tag) so builds don't pile up a new release every push.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: elyxr Windows (latest)
          # The tag is fixed, so GitHub keeps showing the commit it pointed at when
          # it was first created. Say what's really in here.
          body: |
            Build ${{ env.ELYXR_BUILD }} — commit ${{ env.ELYXR_COMMIT }}

            The commit shown against the tag above is NOT what this installer
            contains: the tag never moves, the assets are replaced every push.
            Go by the line above, or by Settings in the app after installing.
          files: |
            elyxr-setup.exe
            elyxr-setup-${{ env.ELYXR_BUILD }}.exe
          make_latest: true
