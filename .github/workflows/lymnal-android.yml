name: lymnal-android

# lymnal's Rust CI. Two jobs on a Linux runner:
#   - build: cross-compiles lymnal for Android (arm64) with the NDK — step one of
#     running lymnal on the phone; anything desktop-only (the tray, etc.) shows up
#     here as a build failure to gate off for Android.
#   - test: runs the workspace test suite (`cargo test`). This is the only place
#     the Rust tests run — the app-build workflows (android, windows) cover the
#     Dart analyze/test, so there is no separate test workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile lymnal for Android (arm64)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d $ANDROID_HOME/ndk/* | tail -1)}"
          echo "Using NDK at $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a build --release -p lymnal

      - name: Upload the Android lymnal binary
        uses: actions/upload-artifact@v4
        with:
          name: lymnal-android-arm64
          path: target/aarch64-linux-android/release/lymnal
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # lymnal builds rusqlite (bundled) and blake3 from source, so it needs a C
      # toolchain and pkg-config present.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Test
        run: cargo test --workspace
